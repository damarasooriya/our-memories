<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>අවුරුදු 20කට පස්සෙ බලන videos</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <h1>Our Memories</h1>
        <p class="subtitle">A digital archive of our best moments</p>
        
        <div class="filter-controls">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="photo">Photos</button>
            <button class="filter-btn" data-filter="video">Videos</button>
        </div>
    </header>

    <main class="timeline-container">
        <div class="timeline-line"></div>
        
        <div id="timeline-wrapper"></div>
    </main>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <div id="lightbox-media-container"></div>
            <div id="lightbox-info-container">
                <span id="lightbox-date" class="mem-date"></span>
                <h2 id="lightbox-title"></h2>
                <p id="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
